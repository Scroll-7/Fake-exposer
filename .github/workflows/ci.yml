name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Tests intentionally run without API keys: groq.test.js asserts the
      # missing-key error paths, and the rest use a random free port.
      # NODE_OPTIONS ne peut pas contenir --experimental-test-coverage (exit 9) :
      # le drapeau doit etre passe directement a node --test.
      - name: Tests node:test avec couverture (hors ligne)
        run: node --test --experimental-test-coverage test/*.test.js

  python-eval:
    name: Eval harness self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install eval dependencies
        run: pip install numpy scikit-learn datasketch
      - name: Run harness self-tests (no dataset required)
        run: python -m unittest eval.test_eval -v
